<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Наполнение бокса — превью секции</title>
</head>
<body style="margin:0;background:#eef0f6">

<!-- ============================================================= -->
<!-- ===== СЕКЦИЯ «НАПОЛНЕНИЕ БОКСА» — вставьте в index.html ====== -->
<!-- ============================================================= -->
<section class="kb" aria-labelledby="kb-title">
  <style>
  @import url('https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700&family=Golos+Text:wght@400;500;600&display=swap');

  .kb{
    --kb-mag:#E91E8C; --kb-blue:#2563EB; --kb-org:#F97316; --kb-grn:#22C55E;
    --kb-bg:#f5f6fa; --kb-card:#ffffff; --kb-ink:#1b2230; --kb-mut:#5a6478; --kb-line:#e4e7f0;
    --kb-h:'Unbounded',system-ui,sans-serif; --kb-b:'Golos Text',system-ui,sans-serif;
    position:relative;box-sizing:border-box;overflow:hidden;
    font-family:var(--kb-b);color:var(--kb-ink);background:var(--kb-bg);
    padding:clamp(48px,7vw,104px) clamp(16px,4.5vw,56px);
  }
  .kb *{box-sizing:border-box}
  .kb__wrap{max-width:1080px;margin:0 auto;text-align:center}
  .kb__eyebrow{display:inline-flex;align-items:center;gap:.55em;font-family:var(--kb-h);font-weight:600;
    font-size:.7rem;letter-spacing:.22em;text-transform:uppercase;color:var(--kb-mag);margin:0 0 .9rem}
  .kb__eyebrow::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--kb-mag);
    box-shadow:0 0 0 4px rgba(233,30,140,.14)}
  .kb__h2{font-family:var(--kb-h);font-weight:700;letter-spacing:-.02em;line-height:1.1;
    font-size:clamp(1.7rem,4vw,3rem);margin:0 0 .7rem}
  .kb__sub{color:var(--kb-mut);font-size:clamp(1rem,1.6vw,1.15rem);max-width:52ch;margin:0 auto}

  /* ---- orbit stage ---- */
  .kb__stage{position:relative;width:min(560px,92vw);aspect-ratio:1/1;margin:clamp(2rem,4vw,3.4rem) auto 0}
  .kb__ringline{position:absolute;inset:calc(50% - var(--R,190px));width:calc(var(--R,190px)*2);height:calc(var(--R,190px)*2);
    border:1.5px dashed #cfd4e4;border-radius:50%;pointer-events:none}
  .kb__ring{position:absolute;inset:0;transform:rotate(var(--rot,0deg))}
  .kb__center{position:absolute;left:50%;top:50%;width:clamp(96px,26%,132px);aspect-ratio:1/1;transform:translate(-50%,-50%);
    display:grid;place-content:center;gap:.35rem;text-align:center;border-radius:24px;
    background:linear-gradient(150deg,#20283a,#0f1420);color:#fff;box-shadow:0 20px 44px rgba(20,26,40,.28);z-index:2}
  .kb__center svg{width:30px;height:30px;margin:0 auto;stroke:#fff}
  .kb__centerTxt{font-family:var(--kb-h);font-weight:600;font-size:.72rem;letter-spacing:.02em;line-height:1.15}

  .kb__node{position:absolute;left:50%;top:50%;
    transform:translate(-50%,-50%) rotate(var(--a)) translateY(calc(-1*var(--R,190px))) rotate(calc(-1*var(--a)));}
  .kb__nodeInner{transform:rotate(calc(-1*var(--rot,0deg)));display:flex;flex-direction:column;align-items:center;gap:.4rem}
  .kb__dot{width:clamp(52px,13vw,72px);aspect-ratio:1/1;border-radius:50%;display:grid;place-items:center;cursor:pointer;
    background:var(--kb-card);border:1px solid var(--kb-line);color:var(--nc,var(--kb-blue));
    box-shadow:0 10px 26px rgba(20,26,40,.12);
    transition:transform .3s cubic-bezier(.3,1,.35,1),box-shadow .3s,border-color .3s}
  .kb__dot svg{width:46%;height:46%;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .kb__dot:hover{transform:scale(1.09);border-color:var(--nc)}
  .kb__dot:focus-visible{outline:2.5px solid var(--nc);outline-offset:3px}
  .kb__node.is-open .kb__dot{transform:scale(1.16);border-color:var(--nc);
    box-shadow:0 0 0 4px color-mix(in srgb,var(--nc) 22%,transparent),0 16px 34px rgba(20,26,40,.2)}
  .kb__cap{font-size:.72rem;font-weight:600;color:var(--kb-mut);max-width:9ch;line-height:1.25;text-align:center}

  /* ---- info card ---- */
  .kb__backdrop{position:absolute;inset:0;background:rgba(18,22,34,.04);opacity:0;pointer-events:none;transition:opacity .3s;z-index:3}
  .kb.is-open .kb__backdrop{opacity:1;pointer-events:auto}
  .kb__info{position:absolute;z-index:5;width:min(280px,86vw);background:var(--kb-card);border:1px solid var(--kb-line);
    border-radius:20px;padding:1.2rem 1.3rem;text-align:left;box-shadow:0 26px 60px rgba(20,26,40,.24);
    opacity:0;transform:scale(.94);pointer-events:none;transition:opacity .28s ease,transform .28s cubic-bezier(.3,1,.35,1)}
  .kb__info.is-open{opacity:1;transform:none;pointer-events:auto}
  .kb__info::before{content:"";position:absolute;top:16px;left:16px;width:34px;height:4px;border-radius:4px;background:var(--nc,var(--kb-blue))}
  .kb__info h3{font-family:var(--kb-h);font-weight:600;font-size:1.08rem;letter-spacing:-.01em;margin:1rem 0 .8rem}
  .kb__row{margin:0 0 .7rem}
  .kb__k{display:block;font-family:var(--kb-h);font-weight:600;font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--nc,var(--kb-blue));margin-bottom:.15rem}
  .kb__v{color:var(--kb-mut);font-size:.9rem;line-height:1.5}
  .kb__tags{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.9rem;padding-top:.9rem;border-top:1px solid var(--kb-line)}
  .kb__tag{font-family:var(--kb-b);font-weight:600;font-size:.76rem;color:var(--kb-ink);background:var(--kb-bg);
    border:1px solid var(--kb-line);border-radius:100px;padding:.4em .9em;cursor:pointer;transition:background .2s,border-color .2s,color .2s}
  .kb__tag:hover{border-color:var(--nc);color:var(--nc)}
  .kb__tag:focus-visible{outline:2.5px solid var(--nc);outline-offset:2px}
  .kb__close{position:absolute;top:12px;right:12px;width:30px;height:30px;border:0;border-radius:50%;cursor:pointer;
    background:var(--kb-bg);color:var(--kb-mut);font-size:1.1rem;line-height:1;display:grid;place-items:center}
  .kb__close:hover{background:#eceef6;color:var(--kb-ink)}

  /* ---- mobile: card becomes bottom sheet ---- */
  @media (max-width:639px){
    .kb.is-open .kb__backdrop{background:rgba(18,22,34,.42)}
    .kb__info{position:fixed;left:0;right:0;bottom:0;top:auto;width:100%;
      border-radius:22px 22px 0 0;transform:translateY(100%);max-height:82vh;overflow:auto;
      padding-top:1.5rem;box-shadow:0 -20px 50px rgba(0,0,0,.3)}
    .kb__info.is-open{transform:none}
  }
  @media (prefers-reduced-motion:reduce){
    .kb__dot,.kb__info{transition:none}
  }
  </style>

  <div class="kb__wrap">
    <p class="kb__eyebrow">Наполнение бокса</p>
    <h2 id="kb-title" class="kb__h2">Что внутри и зачем</h2>
    <p class="kb__sub">Каждый предмет — не игрушка, а инструмент с доказанным механизмом.</p>

    <div class="kb__stage" id="kbStage">
      <div class="kb__backdrop" id="kbBackdrop"></div>
      <div class="kb__ringline" aria-hidden="true"></div>
      <div class="kb__ring" id="kbRing" role="list"></div>
      <div class="kb__center" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="3"/><path d="M8 7V6a4 4 0 0 1 8 0v1"/><path d="M3 12h18"/></svg>
        <span class="kb__centerTxt">Sensory&nbsp;Kit</span>
      </div>
      <div class="kb__info" id="kbInfo" role="dialog" aria-modal="false" aria-labelledby="kbInfoTitle" hidden>
        <button class="kb__close" id="kbClose" aria-label="Закрыть">×</button>
        <h3 id="kbInfoTitle"></h3>
        <div class="kb__row"><span class="kb__k">Что делает</span><span class="kb__v" id="kbDoes"></span></div>
        <div class="kb__row"><span class="kb__k">Почему работает</span><span class="kb__v" id="kbWhy"></span></div>
        <div class="kb__tags" id="kbTags"></div>
      </div>
    </div>
    <noscript><p style="color:#5a6478;margin-top:1.5rem">Для интерактивной схемы включите JavaScript.</p></noscript>
  </div>

  <script>
  (function () {
    var root = document.currentScript.closest('.kb');
    if (root.dataset.kbReady) return; root.dataset.kbReady = '1';
    var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    var isMobile = function () { return matchMedia('(max-width:639px)').matches; };

    var ICON = {
      head:'<path d="M4 14v-2a8 8 0 0 1 16 0v2"/><rect x="2.5" y="13.5" width="4.6" height="6.5" rx="2.2"/><rect x="16.9" y="13.5" width="4.6" height="6.5" rx="2.2"/>',
      pillow:'<rect x="4" y="7" width="16" height="11" rx="4.5"/><path d="M7.5 7.5c-1.6 3-1.6 7 0 10M16.5 7.5c1.6 3 1.6 7 0 10"/>',
      spin:'<circle cx="12" cy="7" r="3"/><circle cx="7" cy="15" r="3"/><circle cx="17" cy="15" r="3"/><circle cx="12" cy="12.5" r="1.6"/>',
      glasses:'<circle cx="7" cy="14" r="3.4"/><circle cx="17" cy="14" r="3.4"/><path d="M10.4 14h3.2M3.7 12l1.6-2.4M20.3 12l-1.6-2.4"/>',
      cards:'<rect x="3" y="6" width="12" height="9" rx="2"/><rect x="9" y="10" width="12" height="9" rx="2"/><path d="M12 13.5h6M12 16h4"/>',
      timer:'<circle cx="12" cy="13.5" r="7.5"/><path d="M12 13.5V9"/><path d="M9.5 3h5"/><path d="M18.5 7.5l1.4-1.4"/>',
      ball:'<circle cx="12" cy="12" r="7"/><path d="M12 5V2.5M12 21.5V19M5 12H2.5M21.5 12H19M6.6 6.6 4.9 4.9M19.1 19.1l-1.7-1.7"/>',
      doc:'<rect x="5" y="3" width="14" height="18" rx="2.5"/><path d="M8.5 8h7M8.5 12h7M8.5 16h4.5"/>'
    };
    var COLORS = ['var(--kb-mag)','var(--kb-blue)','var(--kb-org)','var(--kb-grn)'];

    var ITEMS = [
      {name:'Шумоподавляющие наушники', icon:'head',    does:'Приглушают шум и резкие звуки.',                       why:'Снижают слуховую нагрузку — главный триггер перегрузки.',            rel:[3,7]},
      {name:'Утяжелённая подушка',      icon:'pillow',  does:'Даёт мягкое давление на колени и плечи.',              why:'Глубокое давление активирует проприоцепцию и успокаивает нервную систему.', rel:[6]},
      {name:'Фиджеты и тактильные игрушки', icon:'spin', does:'Занимают руки.',                                     why:'Повторяющиеся движения помогают саморегуляции и концентрации.',       rel:[6]},
      {name:'Затемнённые очки',         icon:'glasses', does:'Защищают от яркого и мигающего света.',                why:'Свет — второй по частоте сенсорный триггер.',                        rel:[0]},
      {name:'Карточки коммуникации',    icon:'cards',   does:'Позволяют общаться без слов.',                        why:'В стрессе речь отключается первой — визуальные подсказки остаются.',  rel:[5,7]},
      {name:'Визуальный таймер',        icon:'timer',   does:'Показывает время наглядно.',                          why:'Предсказуемость снижает тревогу при переходах между задачами.',      rel:[4]},
      {name:'Антистресс-мяч',           icon:'ball',    does:'Снимает мышечное напряжение через сжатие.',           why:'Проприоцептивный ввод помогает «заземлиться».',                      rel:[1,2]},
      {name:'Памятка для взрослого',    icon:'doc',     does:'Пошагово объясняет, как помочь при перегрузке.',      why:'Правильные действия взрослого — половина результата.',               rel:[0,4]}
    ];

    var stage = root.querySelector('#kbStage');
    var ring  = root.querySelector('#kbRing');
    var info  = root.querySelector('#kbInfo');
    var backdrop = root.querySelector('#kbBackdrop');
    var N = ITEMS.length;

    /* build nodes */
    var nodes = ITEMS.map(function (it, i) {
      var node = document.createElement('div');
      node.className = 'kb__node';
      node.setAttribute('role', 'listitem');
      node.style.setProperty('--a', (i * (360 / N)) + 'deg');
      node.style.setProperty('--nc', COLORS[i % COLORS.length]);
      node.innerHTML =
        '<div class="kb__nodeInner">' +
          '<button class="kb__dot" type="button" aria-haspopup="dialog" aria-label="Открыть: ' + it.name + '">' +
            '<svg viewBox="0 0 24 24" aria-hidden="true">' + ICON[it.icon] + '</svg>' +
          '</button>' +
          '<span class="kb__cap">' + it.name + '</span>' +
        '</div>';
      ring.appendChild(node);
      node._dot = node.querySelector('.kb__dot');
      return node;
    });

    /* geometry */
    var R = 190;
    var setR = function () {
      var w = stage.clientWidth;
      R = Math.max(84, w * 0.37);
      stage.style.setProperty('--R', R + 'px');
    };
    setR();
    new ResizeObserver(function () { setR(); if (openIndex !== -1) placeCard(openIndex); }).observe(stage);

    /* rotation loop */
    var rot = 0, last = performance.now(), hovering = false, openIndex = -1;
    ring.style.setProperty('--rot', '0deg');
    function tick(now) {
      var dt = now - last; last = now;
      if (!reduce && !hovering && openIndex === -1) {
        rot = (rot + dt / 40000 * 360) % 360;      // ~40s / revolution
        ring.style.setProperty('--rot', rot + 'deg');
      }
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
    stage.addEventListener('pointerenter', function () { hovering = true; });
    stage.addEventListener('pointerleave', function () { hovering = false; });

    /* card position (desktop: next to node · mobile: bottom sheet) */
    function placeCard(i) {
      if (isMobile()) { info.style.left = info.style.top = ''; return; }
      var ang = (rot + i * (360 / N)) * Math.PI / 180;
      var cx = stage.clientWidth / 2, cy = stage.clientHeight / 2;
      var nx = cx + R * Math.sin(ang), ny = cy - R * Math.cos(ang);
      var cw = info.offsetWidth, ch = info.offsetHeight, gap = 26;
      var left = nx <= cx ? nx + gap : nx - cw - gap;
      var top  = ny - ch / 2;
      left = Math.max(6, Math.min(left, stage.clientWidth - cw - 6));
      top  = Math.max(6, Math.min(top,  stage.clientHeight - ch - 6));
      info.style.left = left + 'px'; info.style.top = top + 'px';
    }

    function openCard(i) {
      var it = ITEMS[i];
      openIndex = i;
      nodes.forEach(function (n, k) { n.classList.toggle('is-open', k === i); });
      info.style.setProperty('--nc', COLORS[i % COLORS.length]);
      root.querySelector('#kbInfoTitle').textContent = it.name;
      root.querySelector('#kbDoes').textContent = it.does;
      root.querySelector('#kbWhy').textContent = it.why;
      var tags = root.querySelector('#kbTags');
      tags.innerHTML = '';
      it.rel.forEach(function (r) {
        var b = document.createElement('button');
        b.type = 'button'; b.className = 'kb__tag'; b.textContent = ITEMS[r].name;
        b.addEventListener('click', function (e) { e.stopPropagation(); openCard(r); });
        tags.appendChild(b);
      });
      info.hidden = false;
      root.classList.add('is-open');
      requestAnimationFrame(function () { placeCard(i); requestAnimationFrame(function () { info.classList.add('is-open'); }); });
      root.querySelector('#kbClose').focus();
    }

    function closeCard(returnFocus) {
      if (openIndex === -1) return;
      var i = openIndex; openIndex = -1;
      info.classList.remove('is-open');
      root.classList.remove('is-open');
      nodes.forEach(function (n) { n.classList.remove('is-open'); });
      setTimeout(function () { if (openIndex === -1) info.hidden = true; }, 280);
      last = performance.now();                    // avoid jump when resuming
      if (returnFocus) nodes[i]._dot.focus();
    }

    nodes.forEach(function (n, i) {
      n._dot.addEventListener('click', function (e) {
        e.stopPropagation();
        if (openIndex === i) closeCard(true); else openCard(i);
      });
    });
    root.querySelector('#kbClose').addEventListener('click', function () { closeCard(true); });
    backdrop.addEventListener('click', function () { closeCard(false); });
    info.addEventListener('click', function (e) { e.stopPropagation(); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeCard(true); });
  })();
  </script>
</section>

</body>
</html>
